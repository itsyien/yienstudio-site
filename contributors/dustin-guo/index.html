  <body>
    <div id="root"></div>
    <div id="adventure-opening" aria-live="polite" role="status">
      <span class="opening-status">Preparing the scene</span>
      <div class="opening-star-layer"></div><div class="opening-star-layer"></div><div class="opening-star-layer"></div>
    </div>
    <script>
      (() => {
        const cover = document.getElementById('adventure-opening')
        let saved
        try { saved = localStorage.getItem('yien-perf-mode') } catch {}
        const historyReturn = performance.getEntriesByType('navigation')[0]?.type === 'back_forward'
        if (location.pathname !== '/' || historyReturn || saved === 'lite' || matchMedia('(prefers-reduced-motion: reduce), (max-width: 768px), (pointer: coarse)').matches || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) { cover.remove(); return }
        const root = document.getElementById('root')
        const boot = window.__yienOpening = { state: 'loading', timer: 0, release, fallback }
        document.documentElement.dataset.opening = 'loading'
        root.inert = true
        root.setAttribute('aria-busy', 'true')
        let seed = 21837
        const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296 }
        cover.querySelectorAll('.opening-star-layer').forEach((layer, index) => {
          const points = Array.from({ length: 32 }, () => `radial-gradient(circle at ${random()*100}% ${random()*100}%, rgba(170,201,255,${.3+random()*.5}) 0 ${.45+index*.25}px, transparent ${1+index*.4}px)`)
          layer.style.backgroundImage = points.join(',')
          layer.style.animationDuration = `${42-index*9}s`
        })
        function release() {
          clearTimeout(boot.timer)
          window.removeEventListener('wheel', interrupt)
          window.removeEventListener('keydown', interrupt)
          cover.remove()
        }
        function fallback() {
          if (boot.state !== 'loading' && boot.state !== 'entering') return
          boot.state = 'fallback'
          document.documentElement.dataset.opening = 'fallback'
          root.inert = false
          root.removeAttribute('aria-busy')
          release()
          window.dispatchEvent(new Event('yien:opening-fallback'))
        }
        function interrupt(event) {
          if (event.type === 'keydown' && event.key !== 'Escape') return
          if (boot.state === 'loading') fallback()
          else if (boot.state === 'entering') {
            if (event.type === 'wheel') event.preventDefault()
            window.dispatchEvent(new Event('yien:opening-skip'))
            if (event.type === 'wheel') {
              const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1
              window.scrollBy({ top: event.deltaY * unit, behavior: 'instant' })
            }
          }
        }
        window.addEventListener('wheel', interrupt, { passive: false })
        window.addEventListener('keydown', interrupt)
        boot.timer = setTimeout(fallback, 8000)
      })()
    </script>
